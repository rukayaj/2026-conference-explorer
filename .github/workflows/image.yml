name: Build image

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'server/**'
      - 'shared/**'
      - 'tests/**'
      - 'public/**'
      - 'scripts/warm-model.mjs'
      - 'astro.config.mjs'
      - 'package.json'
      - 'package-lock.json'
      - 'Dockerfile'
      - '.github/workflows/image.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Check search behavior and data
        run: |
          npm test
          npm run verify
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - id: tag
        run: echo "sha=$(git rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          provenance: false
          sbom: false
          tags: |
            gbifnorway/tdwg2026:${{ steps.tag.outputs.sha }}
            gbifnorway/tdwg2026:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
